# JanuMart application configuration
# H2 file database (created automatically on first run, stored in ./data)
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/janumart;AUTO_SERVER=TRUE
db.user=sa
db.password=

# HikariCP connection pool
pool.maximumPoolSize=10
pool.minimumIdle=2
pool.connectionTimeout=30000
pool.idleTimeout=600000
pool.maxLifetime=1800000

# Application
app.name=JanuMart
app.tagline=Accessories for Human.

# ---------------------------------------------------------------------------
# AI chatbot (Janu AI Shopping Assistant)
# The API key MUST NOT be stored here — set AI_PROVIDER_API_KEY in the server
# environment instead (see .env.example at the project root). When no key is
# configured the assistant still works in honest "catalog" mode using live
# JanuMart data; it never claims to be AI in that mode.
# ---------------------------------------------------------------------------
ai.enabled=false
ai.apiKey=
ai.baseUrl=https://api.openai.com/v1
ai.model=gpt-4o-mini
ai.timeoutSeconds=20
